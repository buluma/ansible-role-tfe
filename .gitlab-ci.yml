---
galaxy:
  rules:
    - if: $CI_COMMIT_TAG != null
  script:
    - ansible-galaxy role import --api-key ${GALAXY_API_KEY} buluma ${CI_PROJECT_NAME}
image: buluma/github-action-molecule:6.0.1
molecule:
  parallel:
    matrix:
      - image: debian
        tag: bullseye
      - image: enterpriselinux
        tag: "8"
      - image: enterpriselinux
        tag: latest
      - image: fedora
        tag: "38"
      - image: fedora
        tag: latest
      - image: ubuntu
        tag: latest
      - image: ubuntu
        tag: focal
      - image: ubuntu
        tag: bionic
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
  script:
    - if [ -f tox.ini ] ; then tox ; fi
    - if [ ! -f tox.ini ] ; then molecule test ; fi
variables:
  PY_COLORS: 1
